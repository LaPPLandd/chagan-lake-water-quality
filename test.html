<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遥感水质多参数反演系统</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; background-color: #001122; } /* 设置深色背景，加载底图前视觉更好 */

        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .concentration-tooltip {
            background: rgba(0, 0, 0, 0.8) !important;
            color: #fff !important;
            border: none !important;
            padding: 4px 8px !important;
            font-weight: bold !important;
        }

        .leaflet-control-zoom { display: none; }

        input[type="radio"]:checked + div {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="relative">

<div id="map"></div>

<div class="glass-panel absolute top-6 left-6 p-5 rounded-2xl w-72">
    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
        <span class="mr-2">🛰️</span> 任务元数据
    </h3>
    <ul class="space-y-3 text-sm">
        <li class="flex justify-between items-center">
            <span class="text-gray-500 font-semibold">监测地区</span>
            <span class="text-gray-900 font-bold bg-blue-100 px-2 py-1 rounded">{{ meta.region }}</span>
        </li>
        <li class="flex justify-between items-center">
            <span class="text-gray-500 font-semibold">影像时间</span>
            <span class="text-gray-900 font-mono">{{ meta.date }}</span>
        </li>
        <li class="flex justify-between items-center">
            <span class="text-gray-500 font-semibold">卫星载荷</span>
            <span class="text-gray-900">{{ meta.satellite }}</span>
        </li>
    </ul>
</div>

<div class="glass-panel absolute top-6 right-6 p-5 rounded-2xl w-64">
    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
        <span class="mr-2">🔄</span> 参数切换
    </h3>
    <div class="space-y-3" id="paramSelector">
        {% for item in results %}
        <label class="relative block cursor-pointer group">
            <input type="radio" name="activeParam" value="{{ item.id }}" class="absolute opacity-0" {% if loop.first %}checked{% endif %}>
            <div class="p-3 border-2 border-gray-100 rounded-xl transition-all flex items-center justify-between group-hover:border-blue-200">
                <span class="font-bold text-gray-700">{{ item.name }}</span>
                <span class="text-xs text-gray-400 font-mono">{{ item.unit }}</span>
            </div>
        </label>
        {% endfor %}
    </div>

    <div class="mt-6 pt-3 border-t">
        <div class="flex justify-between text-xs text-gray-500 mb-2">
            <span>图层透明度</span>
            <span id="opacityVal">100%</span>
        </div>
        <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="1"
               class="w-full accent-blue-600 cursor-pointer">
    </div>
</div>

<div class="glass-panel absolute bottom-6 left-6 p-5 rounded-2xl w-72">
    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
        <span class="mr-2">📈</span> 数据统计 (<span id="activeNameDisplay">-</span>)
    </h3>
    <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-red-50 p-2 rounded-lg">
            <div class="text-[10px] text-red-500 font-bold uppercase">Max</div>
            <div class="text-lg font-black text-gray-800" id="statMax">0.00</div>
        </div>
        <div class="bg-blue-50 p-2 rounded-lg">
            <div class="text-[10px] text-blue-500 font-bold uppercase">Avg</div>
            <div class="text-lg font-black text-gray-800" id="statMean">0.00</div>
        </div>
        <div class="bg-green-50 p-2 rounded-lg">
            <div class="text-[10px] text-green-500 font-bold uppercase">Min</div>
            <div class="text-lg font-black text-gray-800" id="statMin">0.00</div>
        </div>
    </div>
    <div class="mt-4 pt-3 border-t flex justify-between items-center text-xs text-gray-500">
        <span>有效监测像元</span>
        <span class="font-bold text-gray-700" id="statCount">0 px</span>
    </div>
    <div class="flex space-x-2 mt-5">
        {% if report_url %}
        <a href="{{ report_url }}"
           download="水质反演分析报告.pdf"
           class="flex-1 text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition-colors text-sm flex items-center justify-center">
            <span class="mr-1">📥</span> 下载报告
        </a>
        {% endif %}
        <a href="/" class="flex-1 text-center bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 rounded-lg transition-colors text-sm">
            返回
        </a>
    </div>
</div>

<div class="glass-panel absolute bottom-6 right-6 p-4 rounded-2xl w-36 text-center">
    <h4 class="text-xs font-bold text-gray-800 mb-3" id="legendHeader">单位</h4>
    <div class="flex px-2">
        <div class="w-4 h-48 rounded-full" id="legendColorbar"
             style="background: linear-gradient(to top, #0000FF, #00FF00, #FFFF00, #FF7F00, #FF0000);"></div>
        <div class="flex-1 relative h-48 text-[11px] text-gray-600 font-mono ml-3" id="legendTicks">
        </div>
    </div>
</div>

<script>
    const resultsData = {{ results | tojson }};
    const geoserverProxyUrl = "/geoserver_proxy";

    // 🔑 替换为你自己的天地图秘钥
    const TDT_KEY = ""; // Set a public map key before deployment; do not commit private keys.

    let currentWmsLayer = null;
    let activeData = null;

    const colorPalettes = {
        'chla': ['#EDF8E9', '#BAE4B3', '#74C476', '#31A354', '#006D2C'],
        'sdd':   ['#EFF3FF', '#BDD7E7', '#6BAED6', '#3182BD', '#08519C'],
        'tp':   ['#FEEDDE', '#FDBE85', '#FD8D3C', '#E6550D', '#A63603'],
        'default': ['#0000FF', '#00FF00', '#FFFF00', '#FF7F00', '#FF0000']
    };

    // 初始化地图
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([45.2, 124.3], 11);

    // ✅ 修改底图为：天地图影像卫星图 + 中文标注
    const tdt_img = L.tileLayer(`https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TDT_KEY}`, {
        subdomains: ['0', '1', '2', '3', '4', '5', '6', '7']
    }).addTo(map);

    const tdt_cia = L.tileLayer(`https://t{s}.tianditu.gov.cn/cia_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TDT_KEY}`, {
        subdomains: ['0', '1', '2', '3', '4', '5', '6', '7']
    }).addTo(map);

    function formatNumber(val) {
        if (Math.abs(val) < 0.01) return val.toFixed(4);
        if (Math.abs(val) < 1) return val.toFixed(3);
        if (Math.abs(val) < 10) return val.toFixed(2);
        return val.toFixed(1);
    }

    function generateDynamicSLD(layerName, minVal, maxVal, paramId) {
        let step = (maxVal - minVal) / 4;
        if (step <= 0) step = 0.01;
        const colors = colorPalettes[paramId.toLowerCase()] || colorPalettes['default'];

        return `<?xml version="1.0" encoding="UTF-8"?>
        <StyledLayerDescriptor version="1.0.0" xmlns="http://www.opengis.net/sld">
          <NamedLayer>
            <Name>water_project:${layerName}</Name>
            <UserStyle>
              <FeatureTypeStyle>
                <Rule>
                  <RasterSymbolizer>
                    <ColorMap type="ramp">
                      <ColorMapEntry color="#000000" quantity="-9999.0" opacity="0"/>
                      <ColorMapEntry color="${colors[0]}" quantity="${minVal}"/>
                      <ColorMapEntry color="${colors[1]}" quantity="${minVal + step}"/>
                      <ColorMapEntry color="${colors[2]}" quantity="${minVal + step * 2}"/>
                      <ColorMapEntry color="${colors[3]}" quantity="${minVal + step * 3}"/>
                      <ColorMapEntry color="${colors[4]}" quantity="${maxVal}"/>
                    </ColorMap>
                  </RasterSymbolizer>
                </Rule>
              </FeatureTypeStyle>
            </UserStyle>
          </NamedLayer>
        </StyledLayerDescriptor>`;
    }

    function updateDisplay(paramId) {
        activeData = resultsData.find(r => r.id === paramId);
        if (!activeData) return;

        if (currentWmsLayer) map.removeLayer(currentWmsLayer);

        const vmin = activeData.stats.p2 !== undefined ? activeData.stats.p2 : activeData.stats.min;
        const vmax = activeData.stats.p98 !== undefined ? activeData.stats.p98 : activeData.stats.max;
        const pureLayerName = activeData.layer.split(":")[1] || activeData.layer;

        const sldBody = generateDynamicSLD(pureLayerName, vmin, vmax, paramId);

        currentWmsLayer = L.tileLayer.wms(geoserverProxyUrl, {
            layers: activeData.layer,
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            sld_body: sldBody,
            t: Date.now()
        }).addTo(map);

        // 确保标注层始终在最顶层（可选）
        tdt_cia.bringToFront();

        document.getElementById('activeNameDisplay').innerText = activeData.name;
        document.getElementById('statMax').innerText = formatNumber(activeData.stats.max);
        document.getElementById('statMean').innerText = formatNumber(activeData.stats.mean);
        document.getElementById('statMin').innerText = formatNumber(activeData.stats.min);
        document.getElementById('statCount').innerText = activeData.stats.valid_pixel_count;

        const colors = colorPalettes[paramId.toLowerCase()] || colorPalettes['default'];
        document.getElementById('legendColorbar').style.background = `linear-gradient(to top, ${colors.join(', ')})`;
        document.getElementById('legendHeader').innerText = `${activeData.name} (${activeData.unit})`;

        const stepDisplay = (vmax - vmin) / 4;
        let ticksHtml = '';
        for (let i = 0; i <= 4; i++) {
            const val = vmax - i * stepDisplay;
            ticksHtml += `<span class="absolute right-0" style="top: ${i * 25}%">${formatNumber(val)} -</span>`;
        }
        document.getElementById('legendTicks').innerHTML = ticksHtml;
    }

    document.querySelectorAll('input[name="activeParam"]').forEach(radio => {
        radio.addEventListener('change', (e) => updateDisplay(e.target.value));
    });

    document.getElementById('opacitySlider').addEventListener('input', (e) => {
        const val = e.target.value;
        if (currentWmsLayer) currentWmsLayer.setOpacity(val);
        document.getElementById('opacityVal').innerText = Math.round(val * 100) + "%";
    });

    if (resultsData.length > 0) updateDisplay(resultsData[0].id);

    const valueTooltip = L.tooltip({ sticky: true, className: 'concentration-tooltip' });

    map.on('mousemove', function(e) {
        if (!currentWmsLayer || !activeData) return;
        const size = map.getSize();
        const point = map.latLngToContainerPoint(e.latlng);

        const params = {
            request: 'GetFeatureInfo',
            service: 'WMS',
            srs: 'EPSG:4326',
            version: '1.1.1',
            bbox: map.getBounds().toBBoxString(),
            height: size.y, width: size.x,
            layers: activeData.layer,
            query_layers: activeData.layer,
            info_format: 'application/json',
            x: Math.round(point.x),
            y: Math.round(point.y)
        };

        fetch(geoserverProxyUrl + L.Util.getParamString(params))
            .then(res => res.json())
            .then(data => {
                if (data.features && data.features.length > 0) {
                    const val = Object.values(data.features[0].properties)[0];
                    if (val && val > -5000) {
                        valueTooltip.setLatLng(e.latlng)
                            .setContent(`${activeData.name}: <b>${formatNumber(val)}</b> ${activeData.unit}`)
                            .addTo(map);
                    } else { map.closeTooltip(); }
                } else { map.closeTooltip(); }
            }).catch(() => map.closeTooltip());
    });
</script>
</body>
</html>
